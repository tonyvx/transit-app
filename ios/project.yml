name: TransitApp
options:
  bundleIdPrefix: com.tonyvx
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  TransitApp:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: BostonTransitWidget
    entitlements:
      path: App/TransitApp.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tonyvx.transitapp]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Boston Transit
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UILaunchScreen: {}
        MBTA_API_KEY: $(MBTA_API_KEY)
        NSLocationWhenInUseUsageDescription: Used to show your position, work out which train you are on, and plan trips from where you are. Your location stays on your phone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonyvx.transitapp
        DEVELOPMENT_TEAM: DK5MR355S9
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  BostonTransitWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tonyvx.transitapp]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Next trains
        MBTA_API_KEY: $(MBTA_API_KEY)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonyvx.transitapp.widget
        DEVELOPMENT_TEAM: DK5MR355S9
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  TransitAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: TransitApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonyvx.transitapp.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: DK5MR355S9
schemes:
  TransitApp:
    build:
      targets:
        TransitApp: all
    test:
      targets: [TransitAppTests]
